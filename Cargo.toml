[package]
name = "sledge"
version = "0.1.0"
edition = "2024"
# usize::is_multiple_of, which the NDEF padding uses, landed in 1.87.
rust-version = "1.87"
description = "Read and write ACS memory (SLE), ACOS smart cards, and NFC tags over PC/SC"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tsirysndr/sledge"
homepage = "https://github.com/tsirysndr/sledge"
keywords = ["smartcard", "pcsc", "nfc", "ndef", "cli"]
categories = ["command-line-utilities", "hardware-support"]
# CI config is of no use to anyone installing the crate.
exclude = ["/.github"]

[[bin]]
name = "sledge"
path = "src/main.rs"

[dependencies]
pcsc = "2"
hex = "0.4"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
